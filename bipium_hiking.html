<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Заполнить базу — Бипиум</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header-nav">
        <a href="index.html" class="logo">🏔️ <span>Бипиум</span></a>
        <div class="nav-links">
            <a href="index.html">Главная</a>
            <a href="bipium_hiking.html" class="active">📝 Заполнить базу</a>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>📋 Заполнить базу данных</h1>
            <p>Заполните форму — данные уйдут в Бипиум</p>
        </div>
        <div class="content">
            
            <div class="field-group">
                <label>👤 Имя</label>
                <input type="text" id="name" placeholder="Введите имя" required>
            </div>

            <div class="field-group">
                <label>💬 Сообщение / Комментарий</label>
                <textarea id="message" placeholder="Ваше сообщение..."></textarea>
            </div>

            <div class="status-group">
                <label>🔘 Статус</label>
                <div class="status-option">
                    <label>
                        <input type="radio" name="status" value="Новый клиент" checked> 🟢 Новый клиент
                    </label>
                    <label>
                        <input type="radio" name="status" value="Постоянный"> 🔵 Постоянный
                    </label>
                    <label>
                        <input type="radio" name="status" value="Требует звонка"> 🟠 Требует звонка
                    </label>
                </div>
            </div>

            <button type="button" id="submitBtn">✈️ Отправить</button>

            <div id="resultMessage" class="message" style="display: none;"></div>
            <div class="info">
                ⚡ Данные отправляются защищённо через Google Apps Script → Бипиум
            </div>
        </div>
    </div>

    <script>
        // ========== ВАШ URL ОТ GOOGLE APPS SCRIPT ==========
        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwlC_Dw08KQu7wKnl3so8G6E3Zd77MeSOX5ag3xpgWrak3iHxUpZbu8zCmMYoNqhFdm/exec";
        
        const submitBtn = document.getElementById("submitBtn");
        const resultDiv = document.getElementById("resultMessage");
        
        function showMessage(text, type) {
            resultDiv.style.display = "block";
            resultDiv.textContent = text;
            resultDiv.className = `message ${type}`;
            setTimeout(() => {
                resultDiv.style.display = "none";
            }, 5000);
        }
        
        async function sendToWebhook(payload) {
            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(payload),
                });
                
                showMessage("✅ Отправлено! Данные переданы в систему.", "success");
                return true;
                
            } catch (error) {
                console.error("Ошибка:", error);
                showMessage("⚠️ Ошибка при отправке. Попробуйте ещё раз.", "error");
                return false;
            }
        }
        
        submitBtn.addEventListener("click", async () => {
            const name = document.getElementById("name").value.trim();
            const messageText = document.getElementById("message").value.trim();
            
            let selectedStatus = "";
            const radioStatus = document.querySelectorAll('input[name="status"]');
            for (const radio of radioStatus) {
                if (radio.checked) {
                    selectedStatus = radio.value;
                    break;
                }
            }
            
            if (!name) {
                showMessage("Пожалуйста, введите имя", "error");
                return;
            }
            
            const payload = {
                timestamp: new Date().toISOString(),
                name: name,
                message: messageText || "(пусто)",
                status: selectedStatus,
            };
            
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = "⏳ Отправка...";
            submitBtn.disabled = true;
            
            await sendToWebhook(payload);
            
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
            
            document.getElementById("name").value = "";
            document.getElementById("message").value = "";
        });
    </script>

</body>
</html>
