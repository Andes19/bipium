<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Техническое задание | Декорация | Загрузка файлов</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f1f5f9;
            font-family: 'Inter', sans-serif;
            padding: 2rem 1rem;
            color: #0f172a;
        }
        .container { max-width: 1280px; margin: 0 auto; }
        .form-card {
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.02);
            overflow: hidden;
        }
        .toggle-header {
            padding: 1.5rem 2rem 0.75rem 2rem;
            border-bottom: 1px solid #e9eef3;
            background: #ffffff;
        }
        .toggle-header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #1e293b;
            margin-bottom: 1.25rem;
        }
        .toggle-group {
            display: flex;
            gap: 0.75rem;
            background: #f1f5f9;
            padding: 0.5rem;
            border-radius: 60px;
            width: fit-content;
            margin-bottom: 0.5rem;
        }
        .toggle-btn {
            padding: 0.6rem 1.6rem;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 40px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            color: #334155;
            transition: all 0.2s ease;
        }
        .toggle-btn.active {
            background: #ffffff;
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05), 0 1px 1px rgba(0, 0, 0, 0.02);
            border: 0.5px solid #e2e8f0;
        }
        .form-content { padding: 2rem 2rem 2rem 2rem; }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem 2rem;
        }
        .full-width { grid-column: span 2; }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .field-group label {
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #475569;
        }
        input, select, textarea {
            font-family: 'Inter', sans-serif;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            font-size: 0.95rem;
            transition: 0.2s;
            outline: none;
            width: 100%;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #94a3b8;
            box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.2);
        }
        textarea { resize: vertical; min-height: 85px; }
        .radio-group {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 0.25rem;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 400;
            font-size: 0.9rem;
        }
        .radio-option input { width: 18px; height: 18px; accent-color: #2c3e5c; }
        .three-cols {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
        }
        .hidden { display: none !important; }
        .submit-area {
            margin-top: 2rem;
            text-align: right;
            border-top: 1px solid #ecf3fa;
            padding-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }
        .btn-submit {
            background: #1e2f41;
            color: white;
            border: none;
            padding: 0.9rem 2.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }
        .btn-submit:hover { background: #0f1e2c; transform: translateY(-1px); }
        .secondary-text {
            font-size: 0.75rem;
            color: #5b6e8c;
            margin-top: 0.25rem;
        }
        .inline-row {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1e293b;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 24px;
            font-weight: 500;
            z-index: 1000;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            animation: slideIn 0.3s ease;
        }
        .toast.error { background: #b91c1c; }
        .toast.success { background: #166534; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .user-select-row {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .user-select-row select { flex: 2; }
        .user-select-row input { flex: 1; }
        hr { margin: 0.5rem 0 1rem 0; border-color: #e9eef3; }

        /* Стили для загрузки файлов */
        .file-drop-area {
            border: 2px dashed #cbd5e1;
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            background: #f8fafc;
            transition: all 0.2s;
            cursor: pointer;
        }
        .file-drop-area.drag-over {
            border-color: #2c7da0;
            background: #eef2ff;
        }
        .file-input-label {
            display: inline-block;
            background: #1e2f41;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .file-list {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 0.5rem 0.75rem;
            border-radius: 12px;
            font-size: 0.85rem;
        }
        .file-item-name {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            word-break: break-all;
        }
        .file-item-remove {
            background: none;
            border: none;
            color: #e11d48;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 0.5rem;
        }
        .file-limit-warning {
            color: #e11d48;
            font-size: 0.75rem;
            margin-top: 0.5rem;
        }
        .progress-bar {
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #2c7da0;
            transition: width 0.3s;
        }
        @media (max-width: 760px) {
            .form-grid { grid-template-columns: 1fr; gap: 1.2rem; }
            .full-width { grid-column: span 1; }
            .toggle-header { padding: 1.2rem 1.2rem 0.5rem 1.2rem; }
            .form-content { padding: 1.5rem; }
            .three-cols { grid-template-columns: 1fr; gap: 0.75rem; }
            .submit-area { flex-direction: column; }
            .btn-submit { width: 100%; }
            .toast { left: 1rem; right: 1rem; bottom: 1rem; text-align: center; }
        }
    </style>
</head>

<script>
    // ============================================================
    // НАСТРОЙКА: ВАШ ВЕБХУК

    const BITRIX24_WEBHOOK_URL = 'https://dekortv.bitrix24.ru/rest/12/43ogzulnls1sxkdc/';
    // ============================================================

    // --- УПРАВЛЕНИЕ ФАЙЛАМИ (универсальная функция) ---
    let currentFiles = { short: [], full: [] };
    const MAX_FILES = 5;

    function setupFileManager(version) {
        const fileInput = document.getElementById(`${version}FileInput`);
        const dropArea = document.getElementById(`${version}FileDropArea`);
        const fileListDiv = document.getElementById(`${version}FileList`);
        const limitWarning = document.getElementById(`${version}FileLimitWarning`);

        function updateFileList() {
            const files = currentFiles[version];
            fileListDiv.innerHTML = '';
            files.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div class="file-item-name">
                        📄 ${file.name} (${(file.size / 1024).toFixed(1)} KB)
                    </div>
                    <button class="file-item-remove" data-index="${index}">✖</button>
                `;
                fileListDiv.appendChild(fileItem);
            });
            // обработчики удаления
            document.querySelectorAll(`#${version}FileList .file-item-remove`).forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(btn.dataset.index);
                    currentFiles[version].splice(idx, 1);
                    updateFileList();
                    updateLimitWarning();
                });
            });
            updateLimitWarning();
        }

        function updateLimitWarning() {
            const remaining = MAX_FILES - currentFiles[version].length;
            if (remaining <= 0) {
                limitWarning.textContent = `Достигнут лимит: не более ${MAX_FILES} файлов`;
            } else {
                limitWarning.textContent = `Можно добавить ещё ${remaining} файл(ов)`;
            }
        }

        function addFiles(newFiles) {
            const remaining = MAX_FILES - currentFiles[version].length;
            const toAdd = newFiles.slice(0, remaining);
            currentFiles[version] = [...currentFiles[version], ...toAdd];
            updateFileList();
            if (toAdd.length < newFiles.length) {
                limitWarning.textContent = `Лимит ${MAX_FILES} файлов. Добавлено только ${toAdd.length} из ${newFiles.length}`;
            }
        }

        // обработчик выбора через input
        fileInput.addEventListener('change', (e) => {
            addFiles(Array.from(e.target.files));
            fileInput.value = '';
        });

        // Drag & Drop
        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('drag-over');
        });
        dropArea.addEventListener('dragleave', () => {
            dropArea.classList.remove('drag-over');
        });
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('drag-over');
            addFiles(Array.from(e.dataTransfer.files));
        });
        // клик по области для вызова input
        dropArea.addEventListener('click', (e) => {
            if (e.target !== dropArea && !e.target.classList.contains('file-input-label')) return;
            fileInput.click();
        });

        updateFileList();
    }

    setupFileManager('short');
    setupFileManager('full');

    // --- Функции для работы с полями "Постановщик / Исполнитель" ---
    function setupUserSelect(selectId, manualInputId) {
        const select = document.getElementById(selectId);
        const manualInput = document.getElementById(manualInputId);
        if (!select || !manualInput) return;
        function updateVisibility() {
            if (select.value === 'manual_short' || select.value === 'manual_short_resp' || 
                select.value === 'manual_full' || select.value === 'manual_full_resp') {
                manualInput.style.display = 'block';
                manualInput.required = true;
            } else {
                manualInput.style.display = 'none';
                manualInput.required = false;
                manualInput.value = '';
            }
        }
        select.addEventListener('change', updateVisibility);
        updateVisibility();
    }
    
    function getUserId(selectId, manualInputId) {
        const select = document.getElementById(selectId);
        const manualInput = document.getElementById(manualInputId);
        if (!select || !manualInput) return null;
        const selectedValue = select.value;
        if (selectedValue === 'manual_short' || selectedValue === 'manual_short_resp' || 
            selectedValue === 'manual_full' || selectedValue === 'manual_full_resp') {
            return manualInput.value;
        }
        return selectedValue;
    }
    
    setupUserSelect('shortCreatorSelect', 'shortCreatorManual');
    setupUserSelect('shortResponsibleSelect', 'shortResponsibleManual');
    setupUserSelect('fullCreatorSelect', 'fullCreatorManual');
    setupUserSelect('fullResponsibleSelect', 'fullResponsibleManual');

    // --- Переключение версий ---
    const shortDiv = document.getElementById('shortVersionForm');
    const fullDiv = document.getElementById('fullVersionForm');
    const toggleBtns = document.querySelectorAll('.toggle-btn');
    let currentVersion = 'short';
    
    function setActiveVersion(version) {
        currentVersion = version;
        if (version === 'short') {
            shortDiv.classList.remove('hidden');
            fullDiv.classList.add('hidden');
        } else {
            shortDiv.classList.add('hidden');
            fullDiv.classList.remove('hidden');
        }
        toggleBtns.forEach(btn => {
            const btnVer = btn.getAttribute('data-version');
            if (btnVer === version) btn.classList.add('active');
            else btn.classList.remove('active');
        });
    }
    
    toggleBtns.forEach(btn => {
        btn.addEventListener('click', () => setActiveVersion(btn.getAttribute('data-version')));
    });

    // --- Динамика для полной версии (подсветка) ---
    const fullLightingYesNo = document.querySelectorAll('input[name="fullHasLighting"]');
    const fullLightingSettingsDiv = document.getElementById('fullLightingSettings');
    const fullAutonomousFields = document.getElementById('fullAutonomousFields');
    const fullMainsFields = document.getElementById('fullMainsFields');
    const fullPowerTypeRadios = document.querySelectorAll('input[name="fullPowerType"]');
    
    function toggleFullLightingBlock() {
        let isLighting = false;
        for (let radio of fullLightingYesNo) if (radio.checked && radio.value === 'Да') isLighting = true;
        if (fullLightingSettingsDiv) {
            if (isLighting) fullLightingSettingsDiv.classList.remove('hidden');
            else fullLightingSettingsDiv.classList.add('hidden');
        }
    }
    
    function toggleFullPowerDetailFields() {
        if (!fullAutonomousFields || !fullMainsFields) return;
        let selectedType = null;
        for (let radio of fullPowerTypeRadios) if (radio.checked) selectedType = radio.value;
        if (selectedType === 'Автономный') {
            fullAutonomousFields.classList.remove('hidden');
            fullMainsFields.classList.add('hidden');
        } else if (selectedType === 'К электросети') {
            fullAutonomousFields.classList.add('hidden');
            fullMainsFields.classList.remove('hidden');
        }
    }
    
    if (fullLightingYesNo.length) fullLightingYesNo.forEach(r => r.addEventListener('change', toggleFullLightingBlock));
    if (fullPowerTypeRadios.length) fullPowerTypeRadios.forEach(r => r.addEventListener('change', toggleFullPowerDetailFields));
    toggleFullLightingBlock();
    toggleFullPowerDetailFields();

    // --- Уведомления ---
    function showToast(message, isError = false) {
        const existingToast = document.querySelector('.toast');
        if (existingToast) existingToast.remove();
        const toast = document.createElement('div');
        toast.className = `toast ${isError ? 'error' : 'success'}`;
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 5000);
    }

    // --- ЗАГРУЗКА ФАЙЛА НА ДИСК БИТРИКС24 ---
    // Определяем ID папки. Нужно создать папку в корне Диска и указать её ID.
    // Временно: если ID не задан, файлы загружаются в корень (ID = 0 или попробуем получить storage)
    // Для надёжности можно загружать в корень пользователя, но лучше указать конкретную папку.
    // Пока используем стандартный корневой storage (ID = 0). Но рекомендуется создать папку.
    const DISK_FOLDER_ID = 568;  // 0 - корень Диска текущего пользователя. Если хотите другую папку, укажите её ID.

    async function uploadFileToDisk(file, version) {
        return new Promise(async (resolve, reject) => {
            try {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const base64 = e.target.result.split(',')[1];
                    const fileName = file.name;
                    
                    const payload = {
                        id: DISK_FOLDER_ID,
                        data: { NAME: fileName },
                        fileContent: [fileName, base64]
                    };
                    
                    const url = `${BITRIX24_WEBHOOK_URL}disk.folder.uploadfile`;
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    if (data.error) {
                        reject(data.error_description || data.error);
                    } else {
                        // Возвращаем ID файла с префиксом n для поля UF_TASK_WEBDAV_FILES [citation:4]
                        resolve({ id: data.result.ID, prefixed: `n${data.result.ID}` });
                    }
                };
                reader.onerror = () => reject('Ошибка чтения файла');
                reader.readAsDataURL(file);
            } catch (err) {
                reject(err.message);
            }
        });
    }

    // --- СОЗДАНИЕ ЗАДАЧИ С ФАЙЛАМИ ---
    async function createTaskWithFiles(taskTitle, taskDescription, creatorId, responsibleId, files) {
        // Сначала загружаем все файлы на диск
        const uploadedFileIds = [];
        if (files && files.length > 0) {
            showToast(`Загрузка ${files.length} файлов...`);
            for (let i = 0; i < files.length; i++) {
                try {
                    const result = await uploadFileToDisk(files[i], currentVersion);
                    uploadedFileIds.push(result.prefixed);
                    showToast(`Файл ${files[i].name} загружен`);
                } catch (err) {
                    showToast(`Ошибка загрузки ${files[i].name}: ${err}`, true);
                    throw new Error(`Ошибка загрузки файла: ${err}`);
                }
            }
        }

        // Создаём задачу с прикреплёнными файлами [citation:4]
        const url = `${BITRIX24_WEBHOOK_URL}tasks.task.add`;
        const taskFields = {
            TITLE: taskTitle,
            DESCRIPTION: taskDescription,
            CREATED_BY: parseInt(creatorId),
            RESPONSIBLE_ID: parseInt(responsibleId)
        };
        
        if (uploadedFileIds.length > 0) {
            taskFields.UF_TASK_WEBDAV_FILES = uploadedFileIds;
        }
        
        const payload = { fields: taskFields };
        
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (data.error) {
                throw new Error(data.error_description || data.error);
            }
            const taskId = data.result?.task?.id || data.result?.id;
            return { success: true, taskId };
        } catch (err) {
            throw new Error(`Ошибка создания задачи: ${err.message}`);
        }
    }

    // --- СБОР ДАННЫХ И СОЗДАНИЕ ЗАДАЧИ ---
    document.getElementById('demoSubmitBtn').addEventListener('click', async () => {
        let taskTitle = '';
        let taskDescription = '';
        let creatorId = '';
        let responsibleId = '';
        let filesToUpload = [];
        
        if (currentVersion === 'short') {
            const projectName = document.getElementById('shortTitle').value;
            const quantity = document.getElementById('shortQuantity').value;
            const address = document.getElementById('shortAddress').value;
            const startDate = document.getElementById('shortStartDate').value;
            const finishDate = document.getElementById('shortFinishDate').value;
            const dismantleDate = document.getElementById('shortDismantleDate').value;
            const placement = document.querySelector('input[name="shortPlacement"]:checked')?.value || '';
            const area = document.getElementById('shortArea').value;
            const has3d = document.querySelector('input[name="short3d"]:checked')?.value || '';
            const hasBrandbook = document.querySelector('input[name="shortBrandbook"]:checked')?.value || '';
            const requirements = document.getElementById('shortRequirements').value;
            
            taskTitle = projectName ? `ТЗ: ${projectName}` : 'Техническое задание (декорация)';
            creatorId = getUserId('shortCreatorSelect', 'shortCreatorManual');
            responsibleId = getUserId('shortResponsibleSelect', 'shortResponsibleManual');
            filesToUpload = currentFiles.short;
            
            taskDescription = `📋 Техническое задание на производство декорации (короткая версия)\n\n`;
            if (projectName) taskDescription += `🏷️ Проект: ${projectName}\n`;
            if (quantity) taskDescription += `📦 Количество: ${quantity}\n`;
            if (address) taskDescription += `📍 Адрес: ${address}\n`;
            if (startDate) taskDescription += `📅 Монтаж с: ${startDate}\n`;
            if (finishDate) taskDescription += `✅ Сдача площадки: ${finishDate}\n`;
            if (dismantleDate) taskDescription += `🔨 Демонтаж: ${dismantleDate}\n`;
            if (placement) taskDescription += `🏠 Место размещения: ${placement}\n`;
            if (area) taskDescription += `📐 Площадь застройки: ${area}\n`;
            if (has3d) taskDescription += `🖥️ 3D модель: ${has3d}\n`;
            if (hasBrandbook) taskDescription += `📘 Бренд-бук: ${hasBrandbook}\n`;
            if (requirements) taskDescription += `\n⚠️ Спецтребования:\n${requirements}\n`;
        } else {
            const projectName = document.getElementById('fullTitle').value;
            const quantity = document.getElementById('fullQuantity').value;
            const address = document.getElementById('fullAddress').value;
            const startDate = document.getElementById('fullStartDate').value;
            const finishDate = document.getElementById('fullFinishDate').value;
            const dismantleDate = document.getElementById('fullDismantleDate').value;
            const placement = document.querySelector('input[name="fullPlacement"]:checked')?.value || '';
            const area = document.getElementById('fullArea').value;
            const has3d = document.querySelector('input[name="full3d"]:checked')?.value || '';
            const hasBrandbook = document.querySelector('input[name="fullBrandbook"]:checked')?.value || '';
            const decorationType = document.getElementById('fullDecorationType').value;
            const material = document.getElementById('fullMaterial').value;
            const dimensions = document.getElementById('fullDimensions').value;
            const weight = document.getElementById('fullWeight').value;
            const hasLighting = document.querySelector('input[name="fullHasLighting"]:checked')?.value || '';
            const lightTemp = document.getElementById('fullLightTemp')?.value || '';
            const powerType = document.querySelector('input[name="fullPowerType"]:checked')?.value || '';
            const autonomousTime = document.getElementById('fullAutonomousTime')?.value || '';
            const cableLength = document.getElementById('fullCableLength')?.value || '';
            const cableColor = document.getElementById('fullCableColor')?.value || '';
            const requirements = document.getElementById('fullRequirements').value;
            
            taskTitle = projectName ? `ТЗ (полная): ${projectName}` : 'Техническое задание на декорацию (полная версия)';
            creatorId = getUserId('fullCreatorSelect', 'fullCreatorManual');
            responsibleId = getUserId('fullResponsibleSelect', 'fullResponsibleManual');
            filesToUpload = currentFiles.full;
            
            taskDescription = `🏛️ Техническое задание на производство декорации (полная версия)\n\n`;
            if (projectName) taskDescription += `🏷️ Проект: ${projectName}\n`;
            if (quantity) taskDescription += `📦 Количество: ${quantity}\n`;
            if (address) taskDescription += `📍 Адрес: ${address}\n`;
            if (startDate) taskDescription += `📅 Монтаж с: ${startDate}\n`;
            if (finishDate) taskDescription += `✅ Сдача площадки: ${finishDate}\n`;
            if (dismantleDate) taskDescription += `🔨 Демонтаж: ${dismantleDate}\n`;
            if (placement) taskDescription += `🏠 Место размещения: ${placement}\n`;
            if (area) taskDescription += `📐 Площадь застройки: ${area}\n`;
            if (has3d) taskDescription += `🖥️ 3D модель: ${has3d}\n`;
            if (hasBrandbook) taskDescription += `📘 Бренд-бук: ${hasBrandbook}\n`;
            if (decorationType) taskDescription += `🎭 Тип декорации: ${decorationType}\n`;
            if (material) taskDescription += `🧱 Основной материал: ${material}\n`;
            if (dimensions) taskDescription += `📏 Размеры (Ш×В×Г): ${dimensions}\n`;
            if (weight) taskDescription += `⚖️ Вес: ${weight} кг\n`;
            if (hasLighting === 'Да') {
                taskDescription += `💡 Подсветка: ${hasLighting}\n`;
                if (lightTemp) taskDescription += `   🌡️ Температура: ${lightTemp}\n`;
                if (powerType) taskDescription += `   🔌 Питание: ${powerType}\n`;
                if (powerType === 'Автономный' && autonomousTime) taskDescription += `   ⏱️ Автономность: ${autonomousTime}\n`;
                if (powerType === 'К электросети' && (cableLength || cableColor)) taskDescription += `   🔌 Кабель: ${cableLength || ''} ${cableColor ? `, цвет ${cableColor}` : ''}\n`;
            } else {
                taskDescription += `💡 Подсветка: нет\n`;
            }
            if (requirements) taskDescription += `\n⚠️ Спецтребования:\n${requirements}\n`;
        }
        
        if (!creatorId || !responsibleId) {
            showToast('❌ Ошибка: укажите постановщика и исполнителя', true);
            return;
        }
        if (!taskTitle || taskTitle.trim() === '') {
            showToast('❌ Ошибка: укажите название проекта', true);
            return;
        }
        
        // Показываем прогресс
        const btn = document.getElementById('demoSubmitBtn');
        const originalText = btn.textContent;
        btn.textContent = '⏳ Отправка...';
        btn.disabled = true;
        
        try {
            const result = await createTaskWithFiles(taskTitle, taskDescription, creatorId, responsibleId, filesToUpload);
            if (result.success) {
                showToast(`✅ Задача успешно создана! ID задачи: ${result.taskId}`);
                // Очищаем файлы после успешной отправки
                if (currentVersion === 'short') {
                    currentFiles.short = [];
                    setupFileManager('short');
                } else {
                    currentFiles.full = [];
                    setupFileManager('full');
                }
            }
        } catch (err) {
            showToast(`❌ ${err.message}`, true);
        } finally {
            btn.textContent = originalText;
            btn.disabled = false;
        }
    });
</script>
