<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отправка данных в Bpium</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="file"] { width: 100%; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; }
        button:disabled { background: #ccc; }
        #status { margin-top: 15px; font-size: 0.9em; }
    </style>
</head>
<body>

    <h2>Новая заявка</h2>
    
    <div class="form-group">
        <label>Текст (Поле 2):</label>
        <input type="text" id="textField" placeholder="Введите текст...">
    </div>

    <div class="form-group">
        <label>Файл (Поле 4):</label>
        <input type="file" id="fileField">
    </div>

    <button id="sendBtn">Отправить</button>
    <div id="status"></div>

<script>
const CONFIG = {
    domain: 'https://bipium.red-red.ru',
    altDomain: 'https://bipium.red-red.ru:8441',
    catalogId: 52,
    fields: { text: "2", file: "4" }
};

// Функция для выбора живого домена (с таймаутом 2 сек)
async function getActiveDomain() {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), 2000);
    
    try {
        await fetch(CONFIG.altDomain + '/api/v1/', { mode: 'no-cors', signal: controller.signal });
        clearTimeout(id);
        return CONFIG.altDomain;
    } catch (e) {
        return CONFIG.domain;
    }
}

document.getElementById('sendBtn').onclick = async function() {
    const btn = this;
    const status = document.getElementById('status');
    const textVal = document.getElementById('textField').value;
    const fileInput = document.getElementById('fileField');
    
    btn.disabled = true;
    status.innerText = "Определяем доступный сервер...";

    const baseUrl = await getActiveDomain();
    
    try {
        let uploadedFileId = null;

        // --- ШАГ 1: Если есть файл, загружаем его ---
        if (fileInput.files.length > 0) {
            status.innerText = "Загрузка файла...";
            const file = fileInput.files[0];

            // 1.1 Получаем параметры для загрузки
            const ticketRes = await fetch(`${baseUrl}/api/v1/files`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    catalogId: CONFIG.catalogId,
                    fieldId: CONFIG.fields.file,
                    name: file.name,
                    size: file.size,
                    mimeType: file.type
                })
            });
            const ticket = await ticketRes.json();
            uploadedFileId = ticket.id;

            // 1.2 Отправляем сам файл (бинарно) в хранилище по полученному адресу
            const formData = new FormData();
            // В зависимости от ответа Bpium, тут могут быть дополнительные поля (S3)
            // Но чаще всего это POST на ticket.uploadUrl
            formData.append('file', file);
            
            await fetch(ticket.uploadUrl, {
                method: 'POST',
                body: formData
            });
        }

        // --- ШАГ 2: Создаем запись в каталоге ---
        status.innerText = "Создание записи...";
        const recordData = {
            values: {
                [CONFIG.fields.text]: textVal
            }
        };

        // Если файл был загружен, прикрепляем его ID
        if (uploadedFileId) {
            recordData.values[CONFIG.fields.file] = [uploadedFileId];
        }

        const saveRes = await fetch(`${baseUrl}/api/v1/catalogs/${CONFIG.catalogId}/records`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(recordData)
        });

        if (saveRes.ok) {
            status.innerText = "✅ Успешно отправлено!";
        } else {
            throw new Error("Ошибка при сохранении записи");
        }

    } catch (err) {
        console.error(err);
        status.innerText = "❌ Ошибка: " + err.message;
    } finally {
        btn.disabled = false;
    }
};
</script>
</body>
</html>
