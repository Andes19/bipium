<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отправка больших файлов в Bpium</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; width: 100%; font-size: 16px; margin-top: 10px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 0.9em; padding: 10px; border-radius: 4px; display: none; white-space: pre-wrap; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .info { background: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }
    </style>
</head>
<body>

    <h2>Новая заявка (Каталог 52)</h2>
    
    <div class="form-group">
        <label for="textField">Текст (Поле ID: 2):</label>
        <input type="text" id="textField" placeholder="Введите текстовое значение...">
    </div>

    <div class="form-group">
        <label for="fileField">Файл до 30МБ (Поле ID: 4):</label>
        <input type="file" id="fileField">
    </div>

    <button id="sendBtn">Отправить напрямую в Bpium</button>
    <div id="status"></div>

<script>
const CONFIG = {
    domain: 'https://bipium.red-red.ru',
    altDomain: 'https://bipium.red-red.ru:8441',
    catalogId: 52,
    fields: { 
        text: "2", 
        file: "4" 
    },
    authString: 'cHJldmlldzpyM2RPd2wzJnlJZW0=' 
};

function showStatus(text, type = 'info') {
    const statusDiv = document.getElementById('status');
    statusDiv.style.display = 'block';
    statusDiv.className = type;
    statusDiv.innerText = text;
}

// Заголовки авторизации
function getAuthHeaders(contentType = null) {
    const headers = {
        'Authorization': `Basic ${CONFIG.authString}`
    };
    if (contentType) {
        headers['Content-Type'] = contentType;
    }
    return headers;
}

// Выбор активного домена (таймаут 2 секунды)
async function getActiveDomain() {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), 2000);
    
    try {
        await fetch(CONFIG.altDomain + '/api/v1/', { mode: 'no-cors', signal: controller.signal });
        clearTimeout(id);
        return CONFIG.altDomain;
    } catch (e) {
        return CONFIG.domain;
    }
}

document.getElementById('sendBtn').onclick = async function() {
    const btn = this;
    const textVal = document.getElementById('textField').value;
    const fileInput = document.getElementById('fileField');
    
    btn.disabled = true;
    showStatus("Проверяем подключение к серверу...", "info");

    const baseUrl = await getActiveDomain();
    
    try {
        let uploadedFileId = null;

        // --- ШАГ 1: Загрузка тяжелого файла в файловое хранилище ---
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            showStatus(`Загрузка файла "${file.name}" (${(file.size/1024/1024).toFixed(2)} МБ) в хранилище Бипиума...`, "info");

            const fileData = new FormData();
            fileData.append('file', file);

            // Отправляем файл напрямую в корень /files как multipart-формат
            const fileRes = await fetch(`${baseUrl}/api/v1/files`, {
                method: 'POST',
                headers: getAuthHeaders(), // Браузер сам выставит Content-Type: multipart/form-data
                body: fileData
            });

            if (!fileRes.ok) {
                const errText = await fileRes.text();
                throw new Error(`Ошибка загрузки файла на сервер: ${errText}`);
            }

            const fileResult = await fileRes.json();
            // Бипиум возвращает объект файла, забираем его ID
            uploadedFileId = fileResult.id; 
        }

        // --- ШАГ 2: Создание записи с привязкой ID файла ---
        showStatus("Файл успешно загружен. Создаем карточку в каталоге...", "info");
        
        const recordData = {
            values: {
                [CONFIG.fields.text]: textVal
            }
        };

        if (uploadedFileId) {
            recordData.values[CONFIG.fields.file] = [ uploadedFileId ];
        }

        const saveRes = await fetch(`${baseUrl}/api/v1/catalogs/${CONFIG.catalogId}/records`, {
            method: 'POST',
            headers: getAuthHeaders('application/json'),
            body: JSON.stringify(recordData)
        });

        if (saveRes.ok) {
            showStatus("✅ Файл и данные успешно сохранены в Бипиум!", "success");
            document.getElementById('textField').value = '';
            fileInput.value = '';
        } else {
            const errData = await saveRes.text();
            throw new Error(`Ошибка при создании записи: ${errData}`);
        }

    } catch (err) {
        console.error(err);
        showStatus("❌ Ошибка выполнения:\n" + err.message, "error");
    } finally {
        btn.disabled = false;
    }
};
</script>
</body>
</html>
