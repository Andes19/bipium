<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отправка заявки в Бипиум</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px 0;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            font-size: 14px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.loading {
            background: #e0e7ff;
            color: #1e40af;
            border: 1px solid #c3dafe;
        }

        .note {
            margin-top: 20px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📝 Отправить заявку</h1>
        <div class="subtitle">Заполните форму — данные отправятся в Бипиум</div>

        <form id="myForm">
            <div class="form-group">
                <label for="subject">Тема обращения *</label>
                <input type="text" id="subject" name="subject" placeholder="Введите тему..." required>
            </div>

            <div class="form-group">
                <label for="file">Прикрепить файл (необязательно)</label>
                <input type="file" id="file" name="file">
                <small style="color: #666; font-size: 12px;">Поддерживаются любые форматы до 5 МБ</small>
            </div>

            <button type="submit" id="submitBtn">Отправить заявку</button>
        </form>

        <div id="status" class="status"></div>
        <div class="note">
            ⚡ Форма отправляет данные в формате JSON. После отправки проверьте каталог в Бипиум.
        </div>
    </div>

    <script>
        // ВАША ССЫЛКА НА ВНЕШНИЙ ЗАПРОС (замените, если нужно)
        const WEBHOOK_URL = 'https://bipium.red-red.ru:8441/api/webrequest/site-requests';

        const form = document.getElementById('myForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
        }

        function hideStatus() {
            statusDiv.style.display = 'none';
        }

        // Отправка данных в Бипиум
        async function sendToBpium(data) {
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Ошибка ${response.status}: ${errorText}`);
            }

            return await response.json();
        }

        // Конвертация файла в base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Обработчик отправки формы
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            
            // Отключаем кнопку и показываем загрузку
            submitBtn.disabled = true;
            showStatus('⏳ Отправка данных в Бипиум...', 'loading');
            
            try {
                // Получаем значения полей
                const subject = document.getElementById('subject').value.trim();
                const fileInput = document.getElementById('file');
                const file = fileInput.files[0];
                
                // Проверяем обязательное поле
                if (!subject) {
                    showStatus('❌ Пожалуйста, заполните тему обращения', 'error');
                    submitBtn.disabled = false;
                    return;
                }
                
                // Формируем данные для отправки
                let data = { subject: subject };
                
                // Если есть файл, конвертируем в base64
                if (file) {
                    // Проверка размера (5 МБ)
                    if (file.size > 5 * 1024 * 1024) {
                        showStatus('❌ Файл слишком большой (максимум 5 МБ)', 'error');
                        submitBtn.disabled = false;
                        return;
                    }
                    
                    const base64 = await fileToBase64(file);
                    data.file = {
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        content: base64.split(',')[1] // убираем metadata
                    };
                }
                
                // Отправляем данные
                const result = await sendToBpium(data);
                
                // Успех!
                showStatus('✅ Заявка успешно отправлена!', 'success');
                form.reset();
                
                // Через 3 секунды скрываем сообщение
                setTimeout(() => {
                    if (statusDiv.className.includes('success')) {
                        hideStatus();
                    }
                }, 3000);
                
            } catch (error) {
                console.error('Ошибка:', error);
                showStatus(`❌ Ошибка: ${error.message}`, 'error');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
