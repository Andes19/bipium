<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Форма связи - Бипиум</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .header {
            background: #1e3a5f;
            color: white;
            padding: 24px 28px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.85;
            font-size: 0.95rem;
        }

        .iframe-wrapper {
            background: #fff;
            padding: 20px 24px 24px 24px;
        }

        .bpium-iframe {
            width: 100%;
            min-height: 550px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: #ffffff;
            transition: all 0.2s;
        }

        .loading-overlay {
            text-align: center;
            padding: 40px 20px;
            background: #f8fafc;
            border-radius: 16px;
            margin-bottom: 16px;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #1e3a5f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-note {
            margin-top: 20px;
            padding: 14px 18px;
            background: #f0f9ff;
            border-left: 4px solid #1e3a5f;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #1e293b;
        }

        .info-note a {
            color: #1e3a5f;
            text-decoration: underline;
        }

        footer {
            background: #f8fafc;
            padding: 16px 24px;
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
        }

        @media (max-width: 640px) {
            .header { padding: 18px 20px; }
            .header h1 { font-size: 1.5rem; }
            .iframe-wrapper { padding: 16px; }
            .bpium-iframe { min-height: 500px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📋 Отправить обращение</h1>
        <p>Пожалуйста, заполните форму — все данные надёжно защищены</p>
    </div>

    <div class="iframe-wrapper">
        <!-- 
            ⚠️ ВСТАВЬТЕ ВАШУ РАБОЧУЮ ССЫЛКУ НА ВНЕШНИЙ ЗАПРОС БИПИУМ
            Ссылка должна быть вида: https://ваш_домен.bpium.ru/api/webrequest/ID_запроса
            или такой, как предоставлено системой.
        -->
        <iframe 
            src="https://bipium.red-red.ru:8441/api/webrequest/preview" 
            class="bpium-iframe"
            title="Форма связи Бипиум"
            frameborder="0"
            scrolling="auto"
            allow="geolocation; microphone; camera; midi; encrypted-media"
            loading="lazy">
        </iframe>

        <!-- Блок с полезной информацией для пользователя -->
        <div class="info-note">
            💡 <strong>Важно:</strong> Файлы и изображения можно прикрепить прямо в этой форме. 
            Если форма не отображается, проверьте <a href="#" id="reloadLink">соединение</a> 
            или обратитесь к администратору.
        </div>
    </div>

    <footer>
        Защищено системой Бипиум | Данные обрабатываются конфиденциально
    </footer>
</div>

<script>
    (function() {
        // Небольшой скрипт для обработки ошибок загрузки iframe
        const iframe = document.querySelector('.bpium-iframe');
        const container = document.querySelector('.iframe-wrapper');
        let loadingDiv = null;

        // Функция для показа индикатора загрузки
        function showLoading() {
            if (loadingDiv) return;
            loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading-overlay';
            loadingDiv.innerHTML = '<div class="spinner"></div><p style="margin-top: 12px;">Загрузка формы...</p>';
            if (iframe && container) {
                iframe.style.display = 'none';
                container.insertBefore(loadingDiv, iframe);
            }
        }

        function hideLoading() {
            if (loadingDiv && loadingDiv.parentNode) {
                loadingDiv.parentNode.removeChild(loadingDiv);
                loadingDiv = null;
            }
            if (iframe) iframe.style.display = 'block';
        }

        // Если iframe уже загружен - убираем индикатор
        if (iframe) {
            iframe.style.display = 'block';
            iframe.onload = function() {
                hideLoading();
            };
            iframe.onerror = function() {
                hideLoading();
                const errorMsg = document.createElement('div');
                errorMsg.style.cssText = 'background:#fee2e2; color:#991b1b; padding:20px; border-radius:16px; text-align:center; margin-top:16px';
                errorMsg.innerHTML = '⚠️ Не удалось загрузить форму. Проверьте ссылку на внешний запрос или обратитесь в поддержку.';
                if (container && !document.querySelector('.error-msg')) {
                    errorMsg.classList.add('error-msg');
                    container.appendChild(errorMsg);
                }
            };

            // Таймаут на случай долгой загрузки
            setTimeout(() => {
                if (loadingDiv) hideLoading();
            }, 3000);
        }

        // Кнопка перезагрузки iframe
        const reloadLink = document.getElementById('reloadLink');
        if (reloadLink && iframe) {
            reloadLink.addEventListener('click', (e) => {
                e.preventDefault();
                const currentSrc = iframe.src;
                iframe.src = 'about:blank';
                showLoading();
                setTimeout(() => {
                    iframe.src = currentSrc;
                }, 100);
            });
        }

        // Автоматический ресайз iframe (опционально)
        function adjustIframeHeight() {
            if (!iframe || !iframe.contentWindow) return;
            try {
                // Если у внешнего запроса есть свойство прокрутки
                const body = iframe.contentWindow.document.body;
                const height = Math.max(body.scrollHeight, body.offsetHeight);
                iframe.style.height = height + 'px';
            } catch(e) { /* CORS ограничения - игнорируем */ }
        }
        if (iframe) iframe.addEventListener('load', adjustIframeHeight);
    })();
</script>

</body>
</html>
