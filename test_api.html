<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отправка данных в Бипиум (через внешний запрос)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        #status { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<h2>Отправить заявку</h2>
<form id="myForm">
    <div class="form-group">
        <label for="subject">Тема</label>
        <input type="text" id="subject" name="subject" required>
    </div>
    <div class="form-group">
        <label for="file">Вложение</label>
        <input type="file" id="file" name="file">
    </div>
    <button type="submit">Отправить</button>
</form>
<div id="status"></div>

<script>
    // !!! ЭТО ВАША ПРАВИЛЬНАЯ ССЫЛКА !!!
    const webhookUrl = 'https://bipium.red-red.ru/api/webrequest/site-requests'; 

    const form = document.getElementById('myForm');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
        event.preventDefault(); // Отменяем стандартную отправку формы
        
        statusDiv.innerHTML = 'Отправка...';
        statusDiv.className = '';

        const formData = new FormData(form); // Собираем все данные формы

        try {
            const response = await fetch(webhookUrl, {
                method: 'POST',
                body: formData, // Отправляем как multipart/form-data
                // Важно: НЕ ставим заголовок Content-Type, браузер установит его сам с правильной границей
            });

            if (response.ok) {
                const result = await response.json(); // Пытаемся прочитать ответ от Бипиум
                statusDiv.innerHTML = `✅ Успешно! Заявка отправлена. Ответ: ${JSON.stringify(result)}`;
                statusDiv.className = 'success';
                form.reset(); // Очищаем форму
            } else {
                const errorText = await response.text();
                statusDiv.innerHTML = `❌ Ошибка! Код: ${response.status}. Ответ сервера: ${errorText}`;
                statusDiv.className = 'error';
                console.error('Ошибка отправки:', errorText);
            }
        } catch (error) {
            statusDiv.innerHTML = `❌ Ошибка сети или запроса: ${error.message}`;
            statusDiv.className = 'error';
            console.error('Ошибка fetch:', error);
        }
    });
</script>

</body>
</html>
